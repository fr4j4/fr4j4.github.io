<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Set fotográfico, 6 tomas · El Chupacabras de Labranza</title><link rel="stylesheet" href="../assets/design/open-case.css"><link rel="stylesheet" href="../assets/design/export.css"></head><body><main class="oc-mesa"><article class="oc-hoja" id="E02"><div class="oc-membrete"><div class="oc-membrete__inst"><b>Laboratorio de Criminalística · Fotografía forense</b>Set fotográfico sitio del suceso · 31-10-2026</div><span class="oc-codigo">E02</span></div><h2>Set fotográfico, 6 tomas</h2><div class="oc-fotos"><figure class="oc-foto"><div class="oc-foto__cuadro"><img src="../assets/media/photos/e02_f1.jpg" alt="Vista general del corral con el cuerpo y la SUV al fondo" loading="eager"></div><figcaption><b>Foto 1 · Vista general.</b> Cuerpo junto al corral, SUV de la víctima al fondo. La ropa está mojada por delante. La espalda y el suelo bajo el cuerpo están secos.</figcaption></figure><figure class="oc-foto"><div class="oc-foto__cuadro"><img src="../assets/media/photos/e02_f2.jpg" alt="Detalle de dos perforaciones en el cuello con regla de 4,5 centímetros" loading="eager"></div><figcaption><b>Foto 2 · Cuello, lado izquierdo.</b> Dos perforaciones circulares de 4 mm, separadas por 4,5 cm entre centros. Bordes limpios, muy poco sangrado.</figcaption></figure><figure class="oc-foto"><div class="oc-foto__cuadro"><img src="../assets/media/photos/e02_f3.jpg" alt="Fila de piedras blancas junto al camino, con el hueco de una piedra que falta" loading="eager"></div><figcaption><b>Foto 3 · Camino de acceso.</b> Fila de 23 piedras de río pintadas de blanco. Entre la 11 y la 12 hay un hueco con la tierra descubierta: falta una piedra hace poco. Frente al portón, huellas de neumático borradas por la lluvia.</figcaption></figure><figure class="oc-foto"><div class="oc-foto__cuadro"><img src="../assets/media/photos/e02_f4.jpg" alt="Huella grande de tres dedos con una grieta en el dedo central" loading="eager"></div><figcaption><b>Foto 4 · Huella de tres dedos</b> a 4 m del cuerpo, 14 cm de largo, parcialmente deformada por la lluvia. Se distingue una grieta diagonal en el dedo central.</figcaption></figure><figure class="oc-foto"><div class="oc-foto__cuadro"><img src="../assets/media/photos/e02_f5.jpg" alt="El cuerpo junto al corral, de noche; a un lado, hacia el bebedero, barro con huellas de perro" loading="eager"></div><figcaption><b>Foto 5 · Huellas de perro</b> de al menos tres animales, marcadas sobre el barro blando que hay a un lado del cuerpo, hacia el bebedero. El suelo bajo el cuerpo está seco; sobre la chaqueta quedaron huellas de barro.</figcaption></figure><figure class="oc-foto"><div class="oc-foto__cuadro"><img src="../assets/media/photos/e02_f6.jpg" alt="Aro plateado con forma de luna sobre tierra seca" loading="eager"></div><figcaption><b>Foto 6 · Bajo el cuerpo</b> , al levantarlo: un aro plateado con forma de luna, seco, sobre tierra seca.</figcaption></figure></div>
