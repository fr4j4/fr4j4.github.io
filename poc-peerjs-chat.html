<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PeerJS Chat PoC</title>
<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: system-ui, sans-serif; background: #1a1a2e; color: #e0e0e0; min-height: 100vh; display: flex; justify-content: center; align-items: center; }
.container { width: 480px; max-width: 95vw; }
h1 { color: #faba72; margin-bottom: 1rem; font-size: 1.3rem; }
.card { background: #16213e; border: 1px solid #2a2a4a; border-radius: 12px; padding: 1.2rem; margin-bottom: 1rem; }
label { display: block; font-size: 0.8rem; color: #8892a0; margin-bottom: 0.3rem; }
input, button { width: 100%; padding: 0.6rem; border-radius: 8px; border: 1px solid #2a2a4a; background: #1a1a2e; color: #e0e0e0; font-size: 0.9rem; margin-bottom: 0.5rem; }
input:focus { outline: none; border-color: #faba72; }
button { background: #faba72; color: #1a1a2e; font-weight: 600; cursor: pointer; border: none; transition: opacity 0.2s; }
button:hover { opacity: 0.85; }
button:disabled { opacity: 0.4; cursor: not-allowed; }
.row { display: flex; gap: 0.5rem; }
.row input { flex: 1; margin-bottom: 0; }
.row button { width: auto; white-space: nowrap; }
.status { font-size: 0.8rem; color: #8892a0; margin: 0.5rem 0; }
.status.connected { color: #bdcd9c; }
.status.error { color: #ff6b6b; }
.chat-box { height: 250px; overflow-y: auto; padding: 0.5rem; background: #0d1117; border-radius: 8px; margin-bottom: 0.5rem; display: flex; flex-direction: column; gap: 0.3rem; }
.msg { padding: 0.4rem 0.7rem; border-radius: 8px; max-width: 80%; font-size: 0.85rem; word-break: break-word; }
.msg.local { background: #faba7222; align-self: flex-end; border: 1px solid #faba7244; }
.msg.remote { background: #9fcafd22; align-self: flex-start; border: 1px solid #9fcafd44; }
.msg .meta { font-size: 0.7rem; color: #8892a0; margin-bottom: 0.2rem; }
.hidden { display: none; }
#myId { font-family: monospace; color: #faba72; font-size: 0.9rem; }
</style>
</head>
<body>
<div class="container">
  <h1>🔌 PeerJS Chat PoC</h1>

  <!-- Paso 1: Iniciar peer -->
  <div class="card" id="step1">
    <label>Tu ID (dejalo vacío para auto-generar)</label>
    <div class="row">
      <input type="text" id="peerIdInput" placeholder="ej: jugador1">
      <button onclick="startPeer()">Iniciar</button>
    </div>
  </div>

  <!-- Paso 2: Conectar -->
  <div class="card hidden" id="step2">
    <div class="status" id="status">🟡 Inicializando...</div>
    <div><label>Tu ID: <span id="myId">-</span></label></div>
    <hr style="border-color:#2a2a4a; margin:0.8rem 0;">
    <label>Conectar a ID:</label>
    <div class="row">
      <input type="text" id="connectInput" placeholder="ID del otro peer">
      <button onclick="connect()">Conectar</button>
    </div>
  </div>

  <!-- Paso 3: Chat -->
  <div class="card hidden" id="step3">
    <div class="status connected" id="chatStatus">✅ Conectado</div>
    <div class="chat-box" id="chatBox"></div>
    <div class="row">
      <input type="text" id="msgInput" placeholder="Escribí un mensaje..." onkeydown="if(event.key==='Enter') sendMsg()">
      <button onclick="sendMsg()">Enviar</button>
    </div>
  </div>
</div>

<script>
let peer = null;
let conn = null;

function log(msg, type = 'info') {
  const el = document.getElementById('status');
  el.textContent = msg;
  el.className = 'status' + (type === 'connected' ? ' connected' : type === 'error' ? ' error' : '');
}

function addMsg(text, from) {
  const box = document.getElementById('chatBox');
  const div = document.createElement('div');
  div.className = 'msg ' + (from === 'local' ? 'local' : 'remote');
  const who = from === 'local' ? 'Tú' : 'Peer';
  div.innerHTML = `<div class="meta">${who} · ${new Date().toLocaleTimeString()}</div>${text}`;
  box.appendChild(div);
  box.scrollTop = box.scrollHeight;
}

function startPeer() {
  const id = document.getElementById('peerIdInput').value.trim() || undefined;
  peer = new Peer(id, { debug: 2 });

  peer.on('open', (myId) => {
    document.getElementById('myId').textContent = myId;
    document.getElementById('step1').classList.add('hidden');
    document.getElementById('step2').classList.remove('hidden');
    log('🟢 Peer listo. Compartí tu ID para que se conecten.');
  });

  peer.on('connection', (incoming) => {
    conn = incoming;
    conn.on('open', () => {
      document.getElementById('step2').classList.add('hidden');
      document.getElementById('step3').classList.remove('hidden');
      log('✅ Conectado con: ' + conn.peer, 'connected');
    });
    conn.on('data', (data) => addMsg(data, 'remote'));
    conn.on('close', () => {
      log('🔴 Desconectado', 'error');
      document.getElementById('step3').classList.add('hidden');
      document.getElementById('step2').classList.remove('hidden');
    });
  });

  peer.on('error', (err) => {
    log('❌ Error: ' + err.type, 'error');
    console.error(err);
  });
}

function connect() {
  const targetId = document.getElementById('connectInput').value.trim();
  if (!targetId) return alert('Ingresá un ID');
  if (!peer) return alert('Iniciá tu peer primero');

  conn = peer.connect(targetId, { reliable: true });

  conn.on('open', () => {
    document.getElementById('step2').classList.add('hidden');
    document.getElementById('step3').classList.remove('hidden');
    log('✅ Conectado a: ' + targetId, 'connected');
  });

  conn.on('data', (data) => addMsg(data, 'remote'));
  conn.on('close', () => {
    log('🔴 Desconectado', 'error');
    document.getElementById('step3').classList.add('hidden');
    document.getElementById('step2').classList.remove('hidden');
  });
  conn.on('error', (err) => log('❌ Error: ' + err.type, 'error'));
}

function sendMsg() {
  const input = document.getElementById('msgInput');
  const text = input.value.trim();
  if (!text || !conn) return;
  conn.send(text);
  addMsg(text, 'local');
  input.value = '';
}
</script>
</body>
</html>
